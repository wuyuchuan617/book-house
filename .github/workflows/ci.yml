name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      - run: npx expo lint

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migrations + smoke test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGHOST=localhost PGPASSWORD=postgres bash supabase/tests/run_local.sh | tee out.txt
          grep -q "ALL SMOKE TESTS PASSED" out.txt
